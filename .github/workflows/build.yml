# Builds Haze Vox for Windows and Mac every time you push, or when you
# press "Run workflow" on the Actions tab. Download the results from the
# finished run's "Artifacts" section.
name: Build Haze Vox

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHAZE_COPY_PLUGIN=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: HazeVox-${{ matrix.name }}
          path: |
            build/HazeVox_artefacts/Release/VST3
            build/HazeVox_artefacts/Release/AU
          if-no-files-found: error

  # Pushing a version tag (e.g. v2.1.0) also publishes a GitHub Release
  # with HazeVox-Windows.zip and HazeVox-Mac.zip for anyone to download.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip plugins
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
